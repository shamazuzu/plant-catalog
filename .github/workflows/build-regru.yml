name: Build REG.RU static site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: kindofgreen-regru
          path: dist/
          if-no-files-found: error
          retention-days: 7
